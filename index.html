<!doctype html>
<html lang="ja">
  <head>

        <div class="actions">
          <a class="button primary" href="./lingonews/">LingoNewsを見る</a>
          <a class="button secondary" href="mailto:engdojo0306@gmail.com">Contact</a>

      <section class="apps" aria-labelledby="apps-title">
        <h2 id="apps-title">Apps</h2>
        <a class="app-card" href="./lingonews/">
          <div>
            <p class="app-kicker">English news learning</p>
